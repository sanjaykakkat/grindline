<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — Grindline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css" />
</head>
<body>
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">👒</div>
      <h1>Join the crew</h1>
      <p>Create your account and start grinding</p>
    </div>

    <div id="error" class="error-msg"></div>
    <div id="success" class="success-msg"></div>

    <form id="signup-form">
      <div class="form-group">
        <label for="name">Your Name</label>
        <input type="text" id="name" placeholder="e.g. Monkey D. You" required maxlength="30" autocomplete="name" />
      </div>

      <div class="form-group">
        <label for="birth">Birth Date</label>
        <input type="date" id="birth" required />
      </div>

      <div class="form-group">
  <label for="gender">Gender</label>
  <select id="gender" required>
    <option value="" disabled selected>Select gender</option>
    <option value="male">Male</option>
    <option value="female">Female</option>
    <option value="other">Other</option>
    <option value="prefer_not">Prefer not to say</option>
  </select>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required autocomplete="email" />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="At least 6 characters" required minlength="6" autocomplete="new-password" />
      </div>

      <button type="submit" class="btn btn-primary" id="signup-btn">Create Account</button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="login.html">Log in</a>
    </div>
  </div>
  <script type="module" src="signup.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>
</body>
</html>
