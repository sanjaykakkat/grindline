<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Grindline — Store</title>

  <link rel="stylesheet" href="store.css" />
</head>

<body>

  <!-- Loading Screen -->
  <div id="loading-screen">
    Loading store...
  </div>


  <!-- Store App -->
  <main id="store-app" class="hidden">

    <!-- Header -->
    <header class="store-header">

      <div>
        <p class="store-label">GRINDLINE</p>
        <h1>Store</h1>
      </div>


      <!-- Player Bounty -->
      <div class="bounty-card">

        <span class="bounty-label">
          YOUR BOUNTY
        </span>

        <strong id="store-bounty">
          ฿0
        </strong>

      </div>

    </header>


    <!-- Intro -->
    <section class="store-intro">

      <h2>Build Your Crew</h2>

      <p>
        Use your Bounty to recruit new characters
        and collect different forms.
      </p>

    </section>


    <!-- Character Store -->
    <section class="store-section">

      <div class="section-heading">

        <span class="section-label">
          CHARACTERS
        </span>

        <h2>Recruit</h2>

      </div>


      <!--
        Characters are generated by store.js
        using data from characters.js
      -->
      <div
        id="store-characters"
        class="store-grid"
      >
      </div>

    </section>

  </main>


  <!-- Bottom Navigation -->
  <nav class="bottom-nav">

    <a
      href="index.html"
      class="nav-item"
    >
      <span class="nav-icon">⌂</span>
      <span>Home</span>
    </a>


    <a
      href="crew.html"
      class="nav-item"
    >
      <span class="nav-icon">♟</span>
      <span>Crew</span>
    </a>


    <a
      href="store.html"
      class="nav-item active"
    >
      <span class="nav-icon">♜</span>
      <span>Store</span>
    </a>


    <a
      href="settings.html"
      class="nav-item"
    >
      <span class="nav-icon">⚙</span>
      <span>Settings</span>
    </a>

  </nav>


  <!-- Store Logic -->
  <script type="module" src="store.js"></script>
<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>
</body>
</html>
