<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — Grindline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css" />
</head>
<body>
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">👒</div>
      <h1>Join the crew</h1>
      <p>Create your account and start grinding</p>
    </div>

    <div id="error" class="error-msg"></div>
    <div id="success" class="success-msg"></div>

    <form id="signup-form">
      <div class="form-group">
        <label for="name">Your Name</label>
        <input type="text" id="name" placeholder="e.g. Monkey D. You" required maxlength="30" autocomplete="name" />
      </div>

      <div class="form-group">
        <label for="birth">Birth Date</label>
        <input type="date" id="birth" required />
      </div>

      <div class="form-group">
  <label for="gender">Gender</label>
  <select id="gender" required>
    <option value="" disabled selected>Select gender</option>
    <option value="male">Male</option>
    <option value="female">Female</option>
    <option value="other">Other</option>
    <option value="prefer_not">Prefer not to say</option>
  </select>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required autocomplete="email" />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="At least 6 characters" required minlength="6" autocomplete="new-password" />
      </div>

      <button type="submit" class="btn btn-primary" id="signup-btn">Create Account</button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="login.html">Log in</a>
    </div>
  </div>

  <script type="module">
    import { signup, onAuth } from "./auth.js";

    // If already logged in → go to app
    onAuth((user) => {
      if (user) {
        window.location.href = "index.html";
      }
    });

    const form = document.getElementById("signup-form");
    const errorEl = document.getElementById("error");
    const successEl = document.getElementById("success");
    const btn = document.getElementById("signup-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.classList.remove("visible");
      successEl.classList.remove("visible");
      errorEl.textContent = "";
      successEl.textContent = "";

      const name = document.getElementById("name").value.trim();
      const birthDate = document.getElementById("birth").value;
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!name || !birthDate || !email || !password) {
        errorEl.textContent = "Please fill in all fields.";
        errorEl.classList.add("visible");
        return;
      }

      if (password.length < 6) {
        errorEl.textContent = "Password must be at least 6 characters.";
        errorEl.classList.add("visible");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Creating account...";

      try {
        await signup(email, password, name, birthDate);
        successEl.textContent = "Account created! Redirecting...";
        successEl.classList.add("visible");
        // onAuth will redirect to index.html
      } catch (err) {
        let msg = "Signup failed. Please try again.";
        if (err.code === "auth/email-already-in-use") {
          msg = "This email is already registered. Try logging in.";
        } else if (err.code === "auth/invalid-email") {
          msg = "Invalid email address.";
        } else if (err.code === "auth/weak-password") {
          msg = "Password is too weak.";
        }
        errorEl.textContent = msg;
        errorEl.classList.add("visible");
        btn.disabled = false;
        btn.textContent = "Create Account";
      }
    });
  </script>
</body>
</html>
