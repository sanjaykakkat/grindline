<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Grindline — Crew</title>

  <link
    rel="stylesheet"
    href="crew.css"
  />

</head>


<body>

  <!-- Loading Screen -->
  <div id="loading-screen">
    Loading crew...
  </div>


  <!-- Main App -->
  <main
    id="crew-app"
    class="hidden"
  >


    <!-- Header -->
    <header class="crew-header">

      <div>

        <p class="page-label">
          GRINDLINE
        </p>

        <h1>
          Your Crew
        </h1>

      </div>


      <div class="crew-count">

        <span class="crew-count-label">
          ACQUIRED
        </span>

        <strong id="crew-count">
          0
        </strong>

      </div>

    </header>



    <!-- Intro -->
    <section class="crew-intro">

      <p>
        Assign your acquired characters to your crew.
        Each character can only hold one position.
      </p>

    </section>



    <!-- =========================
         CREW FORMATION
    ========================== -->

    <section class="crew-formation">


      <!-- Captain -->
      <div
        class="crew-slot captain-slot"
        data-role="captain"
      >

        <p class="role-label">
          CAPTAIN
        </p>


        <div
          class="crew-character"
          id="captain-slot"
        >

          <!-- Generated by crew.js -->

        </div>

      </div>



      <!-- Middle Roles -->
      <div class="crew-row">


        <!-- Navigator -->
        <div
          class="crew-slot"
          data-role="navigator"
        >

          <p class="role-label">
            NAVIGATOR
          </p>


          <div
            class="crew-character"
            id="navigator-slot"
          >

            <!-- Generated by crew.js -->

          </div>

        </div>



        <!-- Swordsman -->
        <div
          class="crew-slot"
          data-role="swordsman"
        >

          <p class="role-label">
            SWORDSMAN
          </p>


          <div
            class="crew-character"
            id="swordsman-slot"
          >

            <!-- Generated by crew.js -->

          </div>

        </div>


      </div>



      <!-- Bottom Roles -->
      <div class="crew-row">


        <!-- Sniper -->
        <div
          class="crew-slot"
          data-role="sniper"
        >

          <p class="role-label">
            SNIPER
          </p>


          <div
            class="crew-character"
            id="sniper-slot"
          >

            <!-- Generated by crew.js -->

          </div>

        </div>



        <!-- Cook -->
        <div
          class="crew-slot"
          data-role="cook"
        >

          <p class="role-label">
            COOK
          </p>


          <div
            class="crew-character"
            id="cook-slot"
          >

            <!-- Generated by crew.js -->

          </div>

        </div>


      </div>


    </section>



    <!-- =========================
         ACQUIRED CHARACTERS
    ========================== -->

    <section class="acquired-section">


      <div class="section-heading">

        <p class="section-label">
          COLLECTION
        </p>

        <h2>
          Acquired Characters
        </h2>

      </div>


      <!-- Generated by crew.js -->
      <div
        id="acquired-characters"
        class="acquired-list"
      >

      </div>


    </section>


  </main>



  <!-- =========================
       CHARACTER PICKER
  ========================== -->

  <div
    id="character-picker"
    class="character-picker hidden"
  >

    <div class="picker-backdrop"></div>


    <div class="picker-panel">


      <div class="picker-header">

        <div>

          <p class="section-label">
            ASSIGN CHARACTER
          </p>

          <h2 id="picker-role-title">
            Choose Character
          </h2>

        </div>


        <button
          id="close-picker"
          class="close-picker-btn"
          type="button"
        >
          ×
        </button>

      </div>



      <!-- Generated by crew.js -->
      <div
        id="picker-characters"
        class="picker-character-list"
      >

      </div>


    </div>

  </div>



  <!-- =========================
       BOTTOM NAVIGATION
  ========================== -->

  <nav class="bottom-nav">


    <a
      href="index.html"
      class="nav-item"
    >

      <span class="nav-icon">
        ⌂
      </span>

      <span class="nav-label">
        Home
      </span>

    </a>



    <a
      href="crew.html"
      class="nav-item active"
    >

      <span class="nav-icon">
        ⚔
      </span>

      <span class="nav-label">
        Crew
      </span>

    </a>



    <a
      href="store.html"
      class="nav-item"
    >

      <span class="nav-icon">
        🛒
      </span>

      <span class="nav-label">
        Store
      </span>

    </a>



    <a
      href="settings.html"
      class="nav-item"
    >

      <span class="nav-icon">
        ⚙
      </span>

      <span class="nav-label">
        Settings
      </span>

    </a>


  </nav>



  <!-- Crew Logic -->
  <script
    type="module"
    src="crew.js"
  ></script>


</body>

</html>
